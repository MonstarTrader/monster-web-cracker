<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="rowFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0b0f1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="headGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="70%"  stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#0b0f1a"/>

  <!-- static grid backdrop -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40"  x2="1200" y2="40"/>
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- horizontal hex byte rows, staggered scrolling -->
  <g font-family="'JetBrains Mono', monospace" font-size="10"
     fill="#22d3ee" letter-spacing="2">
    <text y="30">
      0xA4 0x2F 0xC7 0x1B 0x8E 0xD2 0x5A 0x71 0x1D 0xF3 0x99 0x42
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-300 0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text y="70" fill="#d946ef">
      0xB7 0x60 0x3C 0xAA 0x91 0x4E 0xCC 0x05 0xF2 0x7D 0x11 0xE8
      <animateTransform attributeName="transform" type="translate"
                        from="-300 0" to="0 0" dur="14s" repeatCount="indefinite"/>
    </text>
    <text y="110" fill="#8b5cf6">
      0x33 0xEE 0x71 0x9C 0x2A 0xD4 0x88 0x1F 0x5B 0xA0 0xC6 0x3D
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-300 0" dur="10s" repeatCount="indefinite"/>
    </text>
    <text y="150" fill="#22d3ee" opacity="0.85">
      0x62 0x18 0xFD 0x47 0xB1 0x0E 0x7A 0x95 0xE3 0x29 0x4C 0xB6
      <animateTransform attributeName="transform" type="translate"
                        from="-300 0" to="0 0" dur="16s" repeatCount="indefinite"/>
    </text>
    <text y="190" fill="#d946ef" opacity="0.75">
      0x88 0x5E 0x2B 0xF0 0x1A 0xC3 0x6D 0x97 0x04 0xBA 0x51 0xE9
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-300 0" dur="13s" repeatCount="indefinite"/>
    </text>
    <text y="230" fill="#8b5cf6" opacity="0.6">
      0xC1 0x35 0x9A 0x08 0xD7 0x42 0xBE 0x6F 0x21 0x84 0xFD 0x3A
      <animateTransform attributeName="transform" type="translate"
                        from="-300 0" to="0 0" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- sweeping scan bar -->
  <rect x="0" y="0" width="3" height="260" fill="url(#headGlow)">
    <animate attributeName="x" from="0" to="1200"
             dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- top + bottom glow rules -->
  <rect x="0" y="0"   width="1200" height="1" fill="#22d3ee" opacity="0.6"/>
  <rect x="0" y="259" width="1200" height="1" fill="#8b5cf6" opacity="0.6"/>
</svg>

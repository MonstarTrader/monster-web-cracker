<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#0ea5e9">
        <animate attributeName="stop-color"
                 values="#0ea5e9;#d946ef;#8b5cf6;#0ea5e9"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#d946ef">
        <animate attributeName="stop-color"
                 values="#d946ef;#8b5cf6;#0ea5e9;#d946ef"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color"
                 values="#8b5cf6;#0ea5e9;#d946ef;#8b5cf6"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#0b0f1a"/>

  <!-- animated diagonal scan lines -->
  <g opacity="0.15">
    <line x1="-200" y1="0" x2="0" y2="220" stroke="url(#grad1)" stroke-width="1">
      <animate attributeName="x1" from="-200" to="1400" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0"    to="1600" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="-400" y1="0" x2="-200" y2="220" stroke="url(#grad1)" stroke-width="1">
      <animate attributeName="x1" from="-400" to="1200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="-200" to="1400" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- hex bytes drifting -->
  <g font-family="monospace" font-size="11" fill="#22d3ee" opacity="0.25">
    <text x="40" y="40">0xA4 0x2F 0xC7 0x1B</text>
    <text x="880" y="55">0x8E 0xD2 0x5A 0x71</text>
    <text x="120" y="190">0x1D 0xF3 0x99 0x42</text>
    <text x="840" y="200">0xB7 0x60 0x3C 0xAA</text>
  </g>

  <!-- title block -->
  <g filter="url(#glow)">
    <text x="600" y="98" text-anchor="middle"
          font-family="'JetBrains Mono', 'Fira Code', monospace"
          font-size="52" font-weight="800" fill="url(#grad1)"
          letter-spacing="6">
      MONSTER
      <animate attributeName="opacity" values="1;0.75;1"
               dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="150" text-anchor="middle"
          font-family="'JetBrains Mono', 'Fira Code', monospace"
          font-size="52" font-weight="800" fill="url(#grad1)"
          letter-spacing="6">
      WEB CRACKER
    </text>
  </g>

  <text x="600" y="185" text-anchor="middle"
        font-family="monospace" font-size="13"
        fill="#94a3b8" letter-spacing="4">
    ───  O R  ·  O R A C L E  ·  R I S E  ───
  </text>

  <text x="600" y="208" text-anchor="middle"
        font-family="monospace" font-size="12"
        fill="#22d3ee" letter-spacing="3">
    v5.0  ·  MODERN EDITION  ·  BY MR HAXOR
  </text>

  <!-- sweeping highlight -->
  <rect x="-300" y="0" width="200" height="220" fill="url(#grad2)">
    <animate attributeName="x" from="-300" to="1300"
             dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
